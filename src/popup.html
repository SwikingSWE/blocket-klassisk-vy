<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Blocket Klassisk vy</title>
<style>
  body {
    width: 320px; margin: 0; padding: 12px;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #16181d;
  }
  h1 { font-size: 14px; margin: 0 0 10px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #6a7080; margin: 16px 0 6px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid #eef0f4; }
  li a { flex: 1; color: #0a58ca; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li a:hover { text-decoration: underline; }
  button { border: 1px solid #c8cdd8; background: #fff; border-radius: 3px; padding: 3px 8px; font: inherit; cursor: pointer; }
  button:hover { background: #eef4ff; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 3px 0; }
  .empty { color: #6a7080; font-style: italic; }
  .stats { color: #6a7080; }
</style>
</head>
<body>
  <h1>Blocket – Klassisk vy</h1>

  <h2>Sparade sökningar</h2>
  <ul id="searches"></ul>

  <h2>Lästmarkering</h2>
  <div class="row">
    <span class="stats" id="seen-count">–</span>
    <button id="reset-seen">Nollställ</button>
  </div>

  <h2>Dolda annonser</h2>
  <div class="row">
    <span class="stats" id="hidden-count">–</span>
    <button id="reset-hidden">Visa alla igen</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
